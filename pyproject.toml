[project]
name = "unreasonable-llama"
version = "0.5.0"
description = "HTTP API bindings for llama.cpp built-in example server"
authors = [{ name = "SteelPh0enix", email = "wojciech_olech@hotmail.com"}]
readme = "README.md"
license = "MIT"
repository = "https://github.com/SteelPh0enix/unreasonable-llama/"
requires-python = ">= 3.10"
dependencies = [
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
show_error_context = true
show_column_numbers = true
show_error_code_links = true
pretty = true

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "ruff>=0.9.3",
    "ruff-lsp>=0.0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
exclude = [".git*"]
